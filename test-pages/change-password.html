<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>變更密碼</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="card" id="change">
      <h1>變更密碼</h1>
      <label for="u">帳號</label>
      <input id="u" name="username" autocomplete="username" />
      <label for="cur">目前密碼</label>
      <input id="cur" type="password" autocomplete="current-password" />
      <label for="new">新密碼</label>
      <input id="new" type="password" autocomplete="new-password" />
      <label for="confirm">確認新密碼</label>
      <input id="confirm" type="password" />
      <button type="submit">更新密碼</button>
    </form>
    <script>
      document.getElementById('change').addEventListener('submit', (e) => {
        e.preventDefault();
        location.href = 'success.html';
      });
    </script>
  </body>
</html>
